<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Interactive To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-glow"></div>

  <main class="app-card">
    <header class="app-header">
      <div>
        <span class="badge">Productivity Workspace</span>
        <h1>TaskFlow</h1>
        <p id="current-date" class="subtitle"></p>
      </div>
      <div class="progress-box">
        <span id="progress-text">0 / 0 Done</span>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
    </header>

    <form id="todo-form" class="input-section" autocomplete="off">
      <input
        type="text"
        id="task-input"
        placeholder="What do you need to accomplish?"
        required
      />
      <select id="priority-select" aria-label="Task Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" class="btn-add">+ Add</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-completed" class="btn-clear">Clear Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state">
      <p>No tasks here yet. Add your first task above to get started!</p>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
