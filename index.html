<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraBoard | Interactive Task & Focus Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="dashboard">
    <!-- Top Bento Stats & Focus Timer -->
    <section class="bento-top">
      <div class="bento-card brand-card">
        <span class="pill-tag">✨ Daily Focus Studio</span>
        <h1>AuraBoard</h1>
        <p id="today-label" class="date-text"></p>
        <div class="streak-row">
          <div class="stat-box">
            <strong id="stat-total">0</strong>
            <span>Total</span>
          </div>
          <div class="stat-box">
            <strong id="stat-active">0</strong>
            <span>Pending</span>
          </div>
          <div class="stat-box">
            <strong id="stat-done">0</strong>
            <span>Done</span>
          </div>
        </div>
      </div>

      <div class="bento-card timer-card">
        <span class="pill-tag">⏱️ 25-Min Study Sprint</span>
        <div id="timer-display" class="timer-clock">25:00</div>
        <p id="active-focus-label" class="focus-task-name">Pick a task or start sprint</p>
        <div class="timer-controls">
          <button type="button" id="timer-start" class="btn-coral">Start</button>
          <button type="button" id="timer-pause" class="btn-soft">Pause</button>
          <button type="button" id="timer-reset" class="btn-soft">Reset</button>
        </div>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="bento-card composer-card">
      <form id="task-form" class="composer-form" autocomplete="off">
        <input
          type="text"
          id="task-input"
          placeholder="Add a coding goal, assignment, or daily task..."
          required
        />
        <select id="category-select" aria-label="Category">
          <option value="coding">💻 Coding</option>
          <option value="study">📚 Study</option>
          <option value="project">🚀 Project</option>
          <option value="personal">🌿 Personal</option>
        </select>
        <button type="submit" class="btn-coral">+ Add Task</button>
      </form>
    </section>

    <!-- Search & Filter Bar -->
    <section class="bento-card board-card">
      <div class="board-controls">
        <input
          type="search"
          id="search-input"
          class="search-box"
          placeholder="🔍 Search tasks..."
        />
        <div class="filter-pills">
          <button type="button" class="pill-btn active" data-filter="all">All</button>
          <button type="button" class="pill-btn" data-filter="coding">Coding</button>
          <button type="button" class="pill-btn" data-filter="study">Study</button>
          <button type="button" class="pill-btn" data-filter="project">Project</button>
          <button type="button" class="pill-btn" data-filter="personal">Personal</button>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-msg" class="empty-msg">
        <h3>Your board is clear ✨</h3>
        <p>Add a task above and hit <strong>Focus</strong> on any item to start a 25-minute sprint.</p>
      </div>
    </section>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script src="script.js" defer></script>
</body>
</html>
