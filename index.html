<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestBoard | Interactive Kanban & XP Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrap">
    <!-- Top Header & XP HUD -->
    <header class="top-hud">
      <div class="brand-block">
        <div class="sticker-badge">⚡ INTERACTIVE WORKSPACE</div>
        <h1>QuestBoard</h1>
        <p class="tagline">Turn daily tasks into levels. Drag, promote, and conquer your sprint.</p>
      </div>

      <div class="xp-card">
        <div class="xp-row">
          <span id="rank-title" class="rank-pill">LVL 1 • CODE ROOKIE</span>
          <strong id="xp-counter">0 XP</strong>
        </div>
        <div class="xp-bar-outer">
          <div id="xp-bar-fill" class="xp-bar-inner"></div>
        </div>
        <div class="xp-sub">
          <span id="completed-summary">0 quests completed</span>
          <button type="button" id="sound-toggle" class="sound-btn" title="Toggle sound">🔊 Sound On</button>
        </div>
      </div>
    </header>

    <!-- Task Composer -->
    <section class="composer-bar">
      <form id="quest-form" class="quest-form" autocomplete="off">
        <input
          type="text"
          id="quest-input"
          placeholder="Write a new quest (e.g., Build REST API, Revise DSA Trees)..."
          required
        />
        <select id="quest-tag" aria-label="Quest Category">
          <option value="dev">💻 Dev (+30 XP)</option>
          <option value="study">📘 Study (+25 XP)</option>
          <option value="design">🎨 Design (+20 XP)</option>
          <option value="life">☀️ Daily (+15 XP)</option>
        </select>
        <button type="submit" class="btn-create">+ Launch Quest</button>
      </form>
    </section>

    <!-- Quick Filter & Search Strip -->
    <section class="controls-strip">
      <input
        type="search"
        id="search-box"
        class="search-field"
        placeholder="Filter quests by keyword..."
      />
      <div class="tag-filters">
        <button type="button" class="chip-filter active" data-tag="all">All Quests</button>
        <button type="button" class="chip-filter" data-tag="dev">Dev</button>
        <button type="button" class="chip-filter" data-tag="study">Study</button>
        <button type="button" class="chip-filter" data-tag="design">Design</button>
        <button type="button" class="chip-filter" data-tag="life">Daily</button>
      </div>
    </section>

    <!-- 3-Column Kanban Board -->
    <main class="kanban-grid">
      <section class="kanban-col col-todo" data-status="todo">
        <div class="col-header">
          <h2>📌 Backlog</h2>
          <span id="count-todo" class="col-count">0</span>
        </div>
        <div id="list-todo" class="drop-zone"></div>
      </section>

      <section class="kanban-col col-doing" data-status="doing">
        <div class="col-header">
          <h2>🔥 In Progress</h2>
          <span id="count-doing" class="col-count">0</span>
        </div>
        <div id="list-doing" class="drop-zone"></div>
      </section>

      <section class="kanban-col col-done" data-status="done">
        <div class="col-header">
          <h2>🏆 Completed</h2>
          <span id="count-done" class="col-count">0</span>
        </div>
        <div id="list-done" class="drop-zone"></div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
